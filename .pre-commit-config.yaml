# Pre-commit hooks for SecureAgentNet.
#   Install once:  pip install pre-commit && pre-commit install
#   Run manually:  pre-commit run --all-files
#
# These mirror the CI lint/format gates so problems are caught before push.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^deployment/.*apparmor.*$
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: ['--line-length=100']
        files: ^(secureagentnet|tests|scripts)/

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']
        files: ^(secureagentnet|tests|scripts)/

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        # Match CI: hard-fail only on real errors; style is advisory there.
        args: ['--select=E9,F63,F7,F82', '--show-source']
        files: ^(secureagentnet|tests|scripts)/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ['-ll', '--skip=B101']
        files: ^secureagentnet/