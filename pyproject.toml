[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secureagentnet"
version = "2.0.0"
description = "Zero-Trust Security Gateway for Autonomous AI Agents (ITCD Pipeline)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SecureAgentNet Contributors", email = "secureagentnet@example.com"},
]
keywords = [
    "security", "zero-trust", "ai-agents", "sandbox", "docker",
    "pipeline", "audit", "forensics", "pii-redaction", "rate-limiting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
urls = {repository = "https://github.com/secure-agent-net/secure-agent-net"}

dependencies = [
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "PyYAML>=6.0.1",
    "SQLAlchemy>=2.0.21",
    "fastapi>=0.104.0",
    "uvicorn>=0.23.2",
    "Flask>=3.0.0",
    "click>=8.1.7",
    "docker>=6.1.3",
    "hvac>=1.2.1",
    "cryptography>=41.0.4",
    "PyJWT>=2.8.0",
    "requests>=2.31.0",
    "flask-cors>=4.0.0",
    "flask-limiter>=3.5.0",
    "redis>=5.0.1",
    "alembic>=1.18.0",
    "rich>=13.7.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "PySide6>=6.6.0",
    "websockets>=12.0",
    "psutil>=5.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "mypy>=1.8",
    "black>=24.0",
    "isort>=5.13",
]
prod = [
    "psycopg2-binary>=2.9",
    "gunicorn>=21.0",
    "a2wsgi>=1.10",
]
agents = [
    "langchain>=1.0",
    "langchain-ollama>=1.0",
]

[project.scripts]
secureagentnet = "secureagentnet.interfaces.cli.terminal:cli"
san = "secureagentnet.interfaces.cli.terminal:cli"
secureagentnet-desktop = "secureagentnet.desktop.app:main"
secureagentnet-daemon = "secureagentnet.daemon.__main__:main"
secureagentnet-cloud = "secureagentnet.cloud.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["secureagentnet", "secureagentnet.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.ini"]
# Ship the cloud console's Alembic migration environment (templates + revisions)
# so `secureagentnet-cloud --migrate` works from an installed wheel, not just source.
"secureagentnet.cloud.migrations" = ["*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --timeout=30"
timeout = 30
timeout_method = "signal"
asyncio_mode = "auto"
markers = [
    "redteam: Red team / adversarial test scenario",
    "integration: Integration test requiring external services",
    "unit: Unit tests",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

# Typing ratchet (see docs/engineering/TYPING.md): the whole tree is checked for
# signal but only an *enforced core* gates CI (the `typecheck-strict` target runs
# mypy --follow-imports=silent over the security-critical modules and must pass).
# The modules below are exempted from the gate because their mypy errors come from
# third-party abstract-base conformance, GUI dynamic attributes, or ORM
# declarative typing — high-noise, low-value to annotate. Shrink this list over time.
[[tool.mypy.overrides]]
module = [
    "secureagentnet.decide.pii_redactor",   # Presidio NlpEngine override signatures
    "secureagentnet.cloud.models",          # SQLAlchemy declarative Columns
    "secureagentnet.database.models",       # SQLAlchemy declarative Columns
    "secureagentnet.desktop.*",             # PySide/Qt dynamic attributes
]
ignore_errors = true

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
]
