version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:14
    container_name: securenet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securenet_db
      POSTGRES_USER: secureagent
      POSTGRES_PASSWORD: securepassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../src/database/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureagent -d securenet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  vault:
    image: vault:latest
    container_name: securenet-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/file
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: securenet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  ollama:
    image: ollama/ollama:latest
    container_name: securenet-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

  app:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    container_name: securenet-app
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://secureagent:securepassword@postgres:5432/securenet_db
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_API_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: llama3.2:7b
    ports:
      - "5000:5000"
      - "8443:8443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/app
    working_dir: /app
    command: python -m src.main
    logging: *default-logging

volumes:
  pgdata:
  vault_data:
  redis_data:
  ollama_data:
