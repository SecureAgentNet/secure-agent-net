apiVersion: apps/v1
kind: Deployment
metadata:
  name: securenet-app
  namespace: securenet
  labels:
    app.kubernetes.io/name: secureagentnet
    app.kubernetes.io/component: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secureagentnet
      app.kubernetes.io/component: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secureagentnet
        app.kubernetes.io/component: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: secureagentnet/app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
              protocol: TCP
            - containerPort: 8443
              name: mcp
              protocol: TCP
          envFrom:
            - configMapRef:
                name: securenet-config
            - secretRef:
                name: securenet-secrets
          env:
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: securenet-secrets
                  key: vault_token
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securenet-secrets
                  key: postgres_password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: securenet-secrets
                  key: secret_key
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: "256Mi"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: secureagentnet
                    app.kubernetes.io/component: app
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "securenet-only"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      restartPolicy: Always
