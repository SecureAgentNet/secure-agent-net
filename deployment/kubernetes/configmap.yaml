apiVersion: v1
kind: ConfigMap
metadata:
  name: securenet-config
  namespace: securenet
  labels:
    app.kubernetes.io/name: secureagentnet
    app.kubernetes.io/component: config
data:
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql://secureagent@securenet-postgres:5432/securenet_db"
  VAULT_ADDR: "http://securenet-vault:8200"
  REDIS_HOST: "securenet-redis"
  REDIS_PORT: "6379"
  OLLAMA_API_URL: "http://securenet-ollama:11434/api/generate"
  OLLAMA_MODEL: "llama3.2:7b"
  MCP_PORT: "8443"
  AGENT_JWT_ALGORITHM: "HS256"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "10"
  CONTAINER_CPU_LIMIT: "1.0"
  CONTAINER_MEMORY_LIMIT: "512m"
  JWT_EXPIRATION: "3600"
  KILL_SWITCH_THRESHOLD: "3"
  CIRCUIT_BREAKER_TIMEOUT: "60"
