services:
  - type: web
    name: san-blog-api
    runtime: python
    buildCommand: pip install fastapi uvicorn sqlalchemy python-multipart
    startCommand: uvicorn blog_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: san-blog-db
          property: connectionString
    autoDeploy: true

databases:
  - name: san-blog-db
    plan: free
