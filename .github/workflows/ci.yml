name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev]"
      # Hard-fail on real errors (syntax, undefined names); style is advisory.
      - run: flake8 secureagentnet/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: flake8 secureagentnet/ tests/ --count --exit-zero --max-complexity=10 --statistics

  typecheck:
    runs-on: ubuntu-latest
    # Gradual typing: mypy runs for signal but does not gate the build yet.
    # ~119 pre-existing errors are being paid down; flip continue-on-error to
    # false once the count reaches zero (see docs/engineering/TYPING.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev]"
      - run: mypy secureagentnet/ --ignore-missing-imports

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python-version }}' }
      - run: pip install -e ".[dev]"
      - run: >-
          pytest tests/unit/ -v --timeout=30 --tb=short
          --cov=secureagentnet --cov-report=term-missing --cov-report=xml
          --cov-fail-under=55
      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  red-team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev]"
      - run: pytest tests/red_team/ -v --timeout=30 --tb=short

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/ -v --timeout=30 --tb=short

  # Deterministic detection-regression gate. Runs the Tier-1 (rule-only)
  # baseline of the DECIDE gateway against the labelled OWASP/MITRE-ATLAS corpus
  # and fails if the committed detection floors regress. No LLM/Ollama needed —
  # the LLM tier is non-deterministic and is benchmarked separately, out of CI.
  detection-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev]"
      - run: python scripts/run_evaluation.py --check
