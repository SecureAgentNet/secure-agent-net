# Alembic configuration for the SecureAgentNet **Cloud Console** database.
#
# This is a *separate* migration environment from the per-host gateway
# (see the repo-root alembic.ini): the console has its own DB, its own Base
# and its own schema history. The database URL is resolved at runtime by
# env.py from CloudSettings.resolved_database_url (SQLite for dev, Postgres
# for the VPS deployment), so the placeholder below is never used directly.
#
# Usual invocations:
#   alembic -c secureagentnet/cloud/alembic.ini upgrade head
#   alembic -c secureagentnet/cloud/alembic.ini revision -m "..." --autogenerate
# or, without the CLI, `secureagentnet-cloud --migrate` (runs upgrade head).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Placeholder only — env.py overrides this with the resolved cloud DB URL.
sqlalchemy.url = sqlite:///./.secureagentnet-cloud/console.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
